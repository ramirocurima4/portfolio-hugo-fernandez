<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Administrador | Hugo Fernández Arte Creativo</title>
  <link rel="stylesheet" href="/static/css/estilos.css">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    :root {
      --deep-abyss: #040911;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #060916 !important;
      background: #060916 !important;
      color: #eef0ff !important;
      font-family: 'Hanken Grotesk', system-ui, -apple-system, sans-serif !important;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(80vw, 500px);
      height: min(80vw, 500px);
      background-image: url('/static/assets/img/logo.png');
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-size: contain;
      opacity: 0.04;
      mix-blend-mode: screen;
      pointer-events: none;
      z-index: 0;
    }

    .login-container {
      width: 90%;
      max-width: 400px;
      margin: auto;
      position: relative;
      z-index: 1;
    }

    .login-card {
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 2rem 1.5rem;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .login-logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 1rem;
      display: block;
      object-fit: contain;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .login-title {
      font-size: 1.25rem;
      color: #ffffff;
      margin-bottom: 0.4rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .login-subtitle {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 1.8rem;
    }

    .login-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      padding: 0.65rem 0.9rem;
      border-radius: 8px;
      font-size: 0.82rem;
      margin-bottom: 1.2rem;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      text-align: left;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .login-label {
      font-size: 0.8rem;
      color: #cbd5e1;
      font-weight: 500;
    }

    .login-input {
      width: 100%;
      display: block;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 12px 14px;
      color: #ffffff;
      font-size: 16px;
      transition: border-color 0.2s ease, background 0.2s ease;
      box-sizing: border-box;
    }

    .login-input:focus {
      outline: none;
      border-color: rgba(255, 255, 255, 0.35);
      background: rgba(255, 255, 255, 0.08);
    }

    .btn-login {
      width: 100%;
      display: block;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      margin-top: 0.4rem;
    }

    .btn-login:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.35);
    }

    .login-footer-text {
      margin-top: 1.5rem;
      font-size: 0.78rem;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <img src="/static/assets/img/logo.png" 
           alt="Hugo Fernández" 
           class="login-logo"
           onerror="this.onerror=null; this.src='assets/img/logo.png';">
      
      <h1 class="login-title">Panel de Administración</h1>
      <p class="login-subtitle">Ingresá la contraseña para acceder al sistema.</p>

      {% if error %}
      <div class="login-error" role="alert">
        {{ error }}
      </div>
      {% endif %}

      <form method="POST" action="/login" class="login-form">
        <div class="form-group">
          <label for="password" class="login-label">Contraseña</label>
          <input type="password" 
                 id="password" 
                 name="password" 
                 class="login-input" 
                 placeholder="••••••••" 
                 autofocus 
                 required>
        </div>

        <button type="submit" class="btn-login">Ingresar</button>
      </form>

      <div class="login-footer-text">
        Hugo Fernández Arte Creativo
      </div>
    </div>
  </div>

</body>
</html>
