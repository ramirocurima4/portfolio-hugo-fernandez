<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Administrador | Hugo Fernández Arte Creativo</title>
  <link rel="stylesheet" href="/static/css/estilos.css">
  <link rel="stylesheet" href="../css/estilos.css">
  <style>
    :root {
      --bg-dark: #0a0a0a;
      --card-bg: #0a192f;
      --dorado: #BF953F;
      --dorado-light: #FCF6BA;
      --dorado-border: rgba(191, 149, 63, 0.4);
      --dorado-glow: rgba(191, 149, 63, 0.25);
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      background: radial-gradient(circle at 50% 20%, rgba(10, 25, 47, 0.9) 0%, rgba(10, 10, 10, 1) 75%);
      color: #ffffff;
      font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      margin: auto;
    }

    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--dorado-border);
      border-radius: 14px;
      padding: 2.8rem 2.2rem;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8), 0 0 25px var(--dorado-glow);
      text-align: center;
      backdrop-filter: blur(10px);
    }

    .login-brand-icon {
      font-size: 2.5rem;
      margin-bottom: 0.6rem;
      display: inline-block;
      filter: drop-shadow(0 2px 8px rgba(191, 149, 63, 0.4));
    }

    .login-brand-title {
      font-family: 'Cinzel', serif;
      font-size: 1.45rem;
      color: var(--dorado);
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 0.3rem;
    }

    .login-subtitle {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 1.8rem;
      line-height: 1.5;
    }

    /* Alerta de error */
    .login-error-alert {
      background: rgba(231, 76, 60, 0.15);
      border: 1px solid #e74c3c;
      color: #ff6b6b;
      padding: 0.75rem 1rem;
      border-radius: 6px;
      font-size: 0.88rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      animation: shake 0.35s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 1.3rem;
      text-align: left;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .login-label {
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--dorado-light);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .login-input {
      width: 100%;
      background: rgba(5, 13, 26, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 0.9rem 1.1rem;
      color: #ffffff;
      font-size: 1.05rem;
      letter-spacing: 2px;
      font-family: inherit;
      transition: all 0.3s ease;
      box-sizing: border-box;
    }

    .login-input:focus {
      outline: none;
      border-color: var(--dorado);
      box-shadow: 0 0 15px rgba(191, 149, 63, 0.4);
      background: rgba(5, 13, 26, 1);
    }

    .btn-login-submit {
      width: 100%;
      background: linear-gradient(45deg, #BF953F, #FCF6BA, #B38728);
      color: #0a0a0a;
      border: none;
      border-radius: 8px;
      padding: 0.95rem 1.5rem;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      margin-top: 0.5rem;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .btn-login-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(191, 149, 63, 0.45);
    }

    .login-back-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 1.8rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .login-back-link:hover {
      color: var(--dorado-light);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <span class="login-brand-icon">👑</span>
      <h1 class="login-brand-title">Hugo Fernández</h1>
      <p class="login-subtitle">Ingresá la contraseña maestra para acceder al Dashboard de Administración.</p>

      {% if error %}
      <div class="login-error-alert" role="alert">
        <span>⚠️</span> {{ error }}
      </div>
      {% endif %}

      <form method="POST" action="/login" class="login-form">
        <div class="form-group">
          <label for="password" class="login-label">
            <span>🔑</span> Contraseña Maestra
          </label>
          <input type="password" 
                 id="password" 
                 name="password" 
                 class="login-input" 
                 placeholder="Ingresa la contraseña..." 
                 autofocus 
                 required>
        </div>

        <button type="submit" class="btn-login-submit">
          <span>🔒</span> Ingresar al Panel
        </button>
      </form>

      <a href="/" class="login-back-link">
        ← Volver al sitio principal
      </a>
    </div>
  </div>

</body>
</html>
